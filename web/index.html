<style>
/* Layout: one working column (max 980px) under a slim sticky bar; lists and editor share it. Grey "aluminium" neutrals with a cool steel-blue accent. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d6dade; --fg:#1d2329; --muted:#5d6670;
  --accent:#2f5d7c; --accent-ink:#ffffff; --accent-soft:#dfe9f1;
  --ok:#2f7a4f; --ok-soft:#dcefe3; --warn:#9a6a12; --warn-soft:#f6ecd6; --bad:#a63d32; --bad-soft:#f6dfdc;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif; --f-body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191d; --surface:#1d2227; --surface-2:#242a30; --line:#343b43; --fg:#e6e9ec; --muted:#9aa4ae;
  --accent:#7fb0d3; --accent-ink:#0f1b24; --accent-soft:#22343f;
  --ok:#7cc79a; --ok-soft:#1f3328; --warn:#e0b45c; --warn-soft:#382d17; --bad:#ec8f84; --bad-soft:#3b2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191d; --surface:#1d2227; --surface-2:#242a30; --line:#343b43; --fg:#e6e9ec; --muted:#9aa4ae;
  --accent:#7fb0d3; --accent-ink:#0f1b24; --accent-soft:#22343f;
  --ok:#7cc79a; --ok-soft:#1f3328; --warn:#e0b45c; --warn-soft:#382d17; --bad:#ec8f84; --bad-soft:#3b2220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:999px;color:var(--muted);font:600 14px var(--f-body);cursor:pointer}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--fg)}
main .wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:var(--r);font:600 14px var(--f-body);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.note{color:var(--muted);font-size:13px}

input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.search{max-width:320px}
/* quote list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}

.qrow:first-child{border-top:0}
.qrow:hover{background:var(--surface-2)}
.qno{font-weight:700;font-size:14px}
.qmeta{color:var(--muted);font-size:13px}

.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);justify-self:end}
.pill.Sent{background:var(--accent-soft);color:var(--accent)}
.pill.Won{background:var(--ok-soft);color:var(--ok)}
.pill.Lost{background:var(--bad-soft);color:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:18px;color:var(--fg);font-family:var(--f-display);font-weight:600}
@media (max-width:620px){.qrow{grid-template-columns:1fr auto}.qrow .pill{grid-row:1;grid-column:2}.qrow .amt{grid-column:2}}
/* items */
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.item .n{font-weight:700;color:var(--muted);padding-top:8px;text-align:center}
.item .fields{display:grid;gap:8px;grid-template-columns:2.4fr .9fr .8fr .8fr 1fr .7fr .7fr;min-width:0}
.item .desc{grid-column:1/-1}
.item .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.item .foot b{font-size:15px}
@media (max-width:760px){.item .fields{grid-template-columns:repeat(3,minmax(0,1fr))}.item .fields .nm{grid-column:1/-1}}
.totals{margin-left:auto;width:min(100%,380px);display:flex;flex-direction:column;gap:6px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .grand{border-top:1px solid var(--line);padding-top:8px;font-size:18px;font-weight:700;font-family:var(--f-display)}
.words{font-size:13px;color:var(--muted);text-align:right}
.dirty{font-size:13px;color:var(--warn);font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:var(--r);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.crow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.crow:first-child{border-top:0}
.bx{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bx .grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.bx-out{font-size:14px}
.bx-out b{font-size:16px}
.bx-warn{color:var(--warn);font-weight:600;font-size:14px}
.bx-err{color:var(--bad);font-weight:600}
.bxg{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.bxp{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:620px){.bxp{grid-template-columns:1fr 1fr}.bxp label:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.btn,.qrow{transition:background .12s}}
</style>

<script>
(() => {
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const inr = (n, dec=2) => Number(n).toLocaleString("en-IN",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const fmtDate = d => { if(!d) return ""; const [y,m,dd] = d.split("-"); return `${dd}-${m}-${y}`; };
const slug = s => (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "client";

const DEFAULT_FIRM = {
  name:"Aggarwal Glass Works", address:"G.T. Road, Bathinda, Punjab", gstin:"", state:"Punjab",
  email:"tostem@agwgroup.in", phone:"", prefix:"AGW/Q/", validityDays:15,
  bank:"", terms:"Payment: 100% advance (30% with order, 30% before dispatch, 40% before installation).\nCancellation forfeits the advance.\nPrices valid for 15 days from the quotation date.\nGST extra as shown."
};

const blankG = () => ({id:"", name:"", desc:"", rate:"", hsn:"", gst:18});
const blankC = () => ({id:"", name:"", adj:""});
const blankP = () => ({name:"", code:"", price:"", unit:"Nos", hsn:"", gst:18, category:""});
let db = null, downloads = null, user = null, canEditPrices = false;
const RANGES = [{id:"imported", label:"Imported", brand:"Imported", doc:"blandox/prices"}, {id:"vixor", label:"Vixor", brand:"Vixor", doc:"blandox/vixor"},
  {id:"closma4516", label:"Closma 4516", brand:"Closma", doc:"blandox/closma4516"}, {id:"closma4507", label:"Closma 4507", brand:"Closma", doc:"blandox/closma4507"},
  {id:"closma3516", label:"Closma 3516", brand:"Closma", doc:"blandox/closma3516"}, {id:"closma4010", label:"Closma 4010", brand:"Closma", doc:"blandox/closma4010"}];
const costDisc = m => num((state.prices||{}).costDisc) || ({imported:60})[m && m.range] || 0;
const rangeBrand = id => (RANGES.find(r => r.id===id) || RANGES[0]).brand;
let state = { priceDocs:{}, bx:null, bxMsg:"", glass:[], colours:[], gForm:blankG(), cForm:blankC(), pForm:blankP(), confirmOpt:null, view:"quotes", quotes:[], clients:[], products:[], importMsg:"", firm:{...DEFAULT_FIRM}, loaded:false, slow:false, error:"", search:"", edit:null, dirty:false, confirmDel:false };

/* ---------- money ---------- */
function calc(q){
  let taxable=0, tax=0; const rows = (q.items||[]).map(it => {
    const base = num(it.qty)*num(it.rate); const t = base*(1-num(it.disc)/100); const g = q.gstOn===false ? 0 : t*num(it.gst)/100;
    taxable+=t; tax+=g; return {taxable:t, tax:g, total:t+g};
  });
  const fr = num(q.freight), frTax = q.gstOn===false ? 0 : fr*num(q.freightGst)/100;
  taxable += fr; tax += frTax;
  const raw = taxable+tax, grand = Math.round(raw);
  return {rows, taxable, tax, fr, frTax, round: grand-raw, grand};
}
function words(n){
  n = Math.round(n); if(n===0) return "Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = x => x<20 ? a[x] : b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three = x => (x>=100 ? a[Math.floor(x/100)]+" Hundred"+(x%100?" ":"") : "")+(x%100?two(x%100):"");
  const parts=[]; const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) parts.push(words(cr)+" Crore"); if(lk) parts.push(two(lk)+" Lakh"); if(th) parts.push(two(th)+" Thousand"); if(n) parts.push(three(n));
  return parts.join(" ");
}
function nextNumber(){
  const p = state.firm.prefix || "";
  let max = 0; state.quotes.forEach(q => { if((q.number||"").startsWith(p)){ const m = q.number.slice(p.length).match(/(\d+)/); if(m) max = Math.max(max, parseInt(m[1],10)); }});
  return p + String(max+1).padStart(3,"0");
}
const blankItem = () => ({name:"", desc:"", hsn:"", qty:1, unit:"Nos", rate:0, disc:0, gst:18});
function newQuote(){
  const d = today();
  return {id:null, number:nextNumber(), date:d, validTill:addDays(d, num(state.firm.validityDays)||15), status:"Draft",
    client:{name:"",company:"",phone:"",email:"",address:"",gstin:"",state:state.firm.state||"Punjab"},
    items:[blankItem()], gstOn:true, taxMode:"intra", freight:0, freightGst:18, notes:"", terms:state.firm.terms||"", sp:spDefault()};
}
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Blandox price list ---------- */
const BX_UNITS = ["INCH","FT","MM"];
const toMm = (v,u) => num(v)*(u==="MM"?1:u==="INCH"?25.4:304.8);
const ft1 = x => String(Math.round(x*100)/100);
const parseRs = s => num(String(s??"").replace(/[^\d.\-]/g,""));
Object.defineProperty(state, "prices", { get(){ const r = (state.bx && state.bx.range) || "imported"; return state.priceDocs[r] || null; }, set(v){ state.priceDocs.imported = v; } });
const rangeLabel = id => (RANGES.find(r => r.id===id) || RANGES[0]).label;
const anyPrices = () => RANGES.some(r => state.priceDocs[r.id]);
function bxSystems(){ const P=state.prices; if(!P) return []; return [...(P.systems||[]).map(s=>s.name), ...new Set((P.acc||[]).map(a=>a.system)), ...(P.rft||[]).map(r=>r.system)]; }
function bxPrice(m){
  const P = state.prices; if(!P) return {err:"Slim profile prices are not loaded yet."};
  if(!m.sys) return {err:"Pick a system to see its price."};
  const unit = (m.wu||"FT").toLowerCase();
  const r = (P.rft||[]).find(x=>x.system===m.sys);
  if(r){ const len = toMm(m.w,m.wu)/304.8; if(!len) return {err:"Enter the running length."};
    return {name:r.desc, rate:r.rate, qty:Math.round(len*(num(m.qty)||1)*100)/100, unit:"Rft", text:`${m.w} ${unit} running length`, priced:`Rs. ${inr(r.rate,0)} per running ft`}; }
  const acc = (P.acc||[]).filter(a=>a.system===m.sys);
  if(acc.length){ let a = acc[0];
    if(acc.length>1){ const mm = toMm(m.w, m.wu||"MM"); if(!mm) return {err:"Enter the handle length (450, 600 or 900 mm)."}; const sorted=[...acc].sort((x,y)=>x.size-y.size); a = sorted.find(x=>x.size>=mm-0.5); if(!a) return {err:`Handles go up to ${sorted[sorted.length-1].size} mm.`}; }
    return {name:a.desc, rate:a.mrp, qty:num(m.qty)||1, unit:"Nos", text:a.option, priced:a.option}; }
  const S = (P.systems||[]).find(s=>s.name===m.sys); if(!S) return {err:"This system is not on the price list."};
  const wft = toMm(m.w,m.wu)/304.8; if(!wft) return {err:"Enter the width."};
  const hBlank = String(m.h??"").trim()==="";
  const hft = hBlank ? num(P.defaultHeightFt) : toMm(m.h,m.hu)/304.8;
  const ws = [...new Set(S.cells.map(c=>c.w))].sort((a,b)=>a-b), hs = [...(P.heights||[])].sort((a,b)=>a-b);
  const W = ws.find(x=>x>=wft-0.001), H = hs.find(x=>x>=hft-0.001);
  if(W==null) return {err:`Width is above the price list (up to ${ws[ws.length-1]} ft for ${m.sys}). Price this size by hand.`};
  if(H==null) return {err:`Height is above the price list (up to ${hs[hs.length-1]} ft). Price this size by hand.`};
  const c = S.cells.find(x=>x.w===W && x.h===H); if(!c) return {err:"No price for this size."};
  const hText = hBlank ? `${ft1(hft)} ft (standard height)` : `${m.h} ${(m.hu||"FT").toLowerCase()}`;
  return {name:S.desc, rate:c.p, qty:num(m.qty)||1, unit:"Set", text:`${m.w} ${unit} W x ${hText} H`, priced:`W upto ${W} ft x H upto ${H} ft`, special:!!c.s};
}
const slim = s => String(s||"").replace(/Blandox Altius profile/gi,"slim profile").replace(/\s*\(Blandox[^)]*\)/gi,"").replace(/Blandox\s*/gi,"").replace(/\s+/g," ").trim();
function colourOf(m){ return state.colours.find(c=>c.name===m.colour) || null; }
function bxArea(m){ const P = state.prices; const wft = toMm(m.w,m.wu)/304.8; const hBlank = String(m.h??"").trim()===""; const hft = hBlank ? num(P.defaultHeightFt) : toMm(m.h,m.hu)/304.8; return Math.round(wft*hft*(num(m.qty)||1)*100)/100; }
function bxQuote(m){
  const r = bxPrice(m); if(r.err) return r;
  const col = colourOf(m), adj = col ? num(col.adj) : 0, isSys = r.unit==="Set";
  const out = {...r, name:slim(r.name), rate: isSys && adj ? Math.round(r.rate*(1+adj/100)/50)*50 : r.rate, colour: col ? col.name : ((state.prices && state.prices.finish) || "Brush Gold"), adj: isSys ? adj : 0};
  if(isSys && (m.parts||[]).length){
    const P = state.prices, n = num(m.qty)||1, parts = m.parts;
    const wft = toMm(m.w,m.wu)/304.8;
    const hft = String(m.h??"").trim()==="" ? num(P.defaultHeightFt) : toMm(m.h,m.hu)/304.8;
    if(parts.some(p=>!p.glass)) return {...out, err:"Choose the glass for each glass part."};
    const lines = [];
    for(const [i,p] of parts.entries()){
      const g = state.glass.find(x=>x.name===p.glass);
      const area = Math.round(num(p.sqft)*100)/100;
      if(!area) return {...out, err:`Enter the sq ft for glass part ${i+1} (${p.glass}).`};
      const rate = num(p.rate) || (g ? num(g.rate) : 0);
      if(!rate) return {...out, err:`Enter the rate per sq ft for glass part ${i+1} (${p.glass}).`};
      const desc = String(p.desc||"").trim() || ((g && g.desc) ? g.desc : "");
      lines.push({glass:p.glass, desc, area, rate, amt:Math.round(area*rate)});
    }
    const totArea = lines.reduce((a,l)=>a+l.area,0);
    lines.forEach(l => { l.hft = totArea ? hft*l.area/totArea : hft/lines.length; });
    const glassAmt = lines.reduce((a,l)=>a+l.amt,0);

const API_URL = window.AGW_API || "";
const store = {}, listeners = [];
const sess = { token:"", device:"", label:"", phone:"", pin:"" };
let syncSince = 0, syncing = false, syncTimer = null;
function lsGet(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function lsSet(k, v){ try{ if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
async function api(action, body = {}){
  let res;
  try{ res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action, token:sess.token, device:sess.device, ...body})}); }
  catch(e){ throw new Error("No internet connection"); }

  const j = await res.json();
  if(j.error === "LOGIN"){ logout("Please log in again."); throw new Error("Please log in again."); }
  if(j.error) throw new Error(j.error);
  return j;
}
function emit(coll){ listeners.forEach(l => { if(l.coll === coll) l.fire(); }); }
function snapOf(coll, order){
  const m = store[coll] || new Map();
  const docs = [...m.entries()].map(([id, d]) => ({id, data:() => d, _d:d}));
  if(order){ const [f, dir] = order; docs.sort((a, b) => { const x = a._d[f] ?? "", y = b._d[f] ?? ""; return (x > y ? 1 : x < y ? -1 : 0) * (dir === "desc" ? -1 : 1); }); }

}
function docSnap(coll, id){ const d = store[coll] && store[coll].get(id); return {exists:!!d, id, data:() => d}; }
function genId(){ const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map(x => (x % 36).toString(36)).join(""); }
function applyLocal(coll, id, data){ if(!store[coll]) store[coll] = new Map(); if(data == null) store[coll].delete(id); else store[coll].set(id, data); emit(coll); }
async function write(coll, id, data){
  const prev = store[coll] && store[coll].get(id);

  try{ await api(data == null ? "delete" : "set", {coll, id, data}); }
  catch(e){ applyLocal(coll, id, prev == null ? null : prev); throw e; }
}
function listen(coll, fire){ const l = {coll, fire}; listeners.push(l); if(state.synced) setTimeout(fire, 0); return () => { const i = listeners.indexOf(l); if(i >= 0) listeners.splice(i, 1); }; }
function docRef(coll, id){ id = id || genId(); return { id,
  set: data => write(coll, id, JSON.parse(JSON.stringify(data))),
  delete: () => write(coll, id, null),
  get: async () => docSnap(coll, id),
  onSnapshot: cb => listen(coll, () => cb(docSnap(coll, id))) }; }
function collRef(coll, order){ return {
  orderBy: (f, dir) => collRef(coll, [f, dir || "asc"]),
  doc: id => docRef(coll, id),
  onSnapshot: cb => listen(coll, () => cb(snapOf(coll, order))) }; }
function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer = setTimeout(doSync, ms); }
async function doSync(){
  if(syncing || !sess.token) return; syncing = true;
  try{
    const r = await api("sync", {since:syncSince}), touched = new Set();
    r.docs.forEach(d => {
      if(!store[d.coll]) store[d.coll] = new Map();
      const cur = store[d.coll].get(d.id);
      if(d.deleted || d.data == null){ if(cur !== undefined){ store[d.coll].delete(d.id); touched.add(d.coll); } }
      else if(JSON.stringify(cur) !== JSON.stringify(d.data)){ store[d.coll].set(d.id, d.data); touched.add(d.coll); }
    });
    syncSince = Math.max(0, r.now - 5000);
    const staffChanged = JSON.stringify([gate.staff, gate.devices]) !== JSON.stringify([r.staff, r.devices || gate.devices]);
    gate.staff = r.staff || []; if(r.devices) gate.devices = r.devices;
    if(r.me){ gate.me = r.me; gate.isAdmin = r.me.role === "admin"; canEditPrices = gate.isAdmin; lsSet("agwq.me", JSON.stringify(r.me)); }
    const first = !state.synced; state.synced = true; state.error = "";
    if(first){ listeners.forEach(l => l.fire()); render(); }
    else { touched.forEach(emit); if(staffChanged && (state.view === "team" || state.view === "edit")) render(); }
  }catch(e){ if(!state.synced && sess.token){ state.error = "Can't reach the server (" + e.message + "). It retries automatically."; render(); } }
  finally{ syncing = false; if(sess.token) scheduleSync(document.hidden ? 120000 : 30000); }
}

async function sha256(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function idbGet(){ return new Promise(res => { try{ const r = indexedDB.open("agwq", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => { try{ const g = r.result.transaction("k").objectStore("k").get("dev"); g.onsuccess = () => res(g.result || ""); g.onerror = () => res(""); }catch(e){ res(""); } }; r.onerror = () => res(""); }catch(e){ res(""); } }); }
function idbSet(v){ try{ const r = indexedDB.open("agwq", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => { try{ r.result.transaction("k", "readwrite").objectStore("k").put(v, "dev"); }catch(e){} }; }catch(e){} }
async function deviceKey(){ let k = lsGet("agwq.dev"); if(!k) k = await idbGet();
  if(!k){ const a = new Uint8Array(24); crypto.getRandomValues(a); k = [...a].map(x => x.toString(16).padStart(2, "0")).join(""); }
  lsSet("agwq.dev", k); idbSet(k); return k; }
function deviceLabel(){ const u = navigator.userAgent;
  const os = /Android/.test(u) ? "Android phone" : /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Windows/.test(u) ? "Windows PC" : /Macintosh|Mac OS/.test(u) ? "Mac" : /Linux/.test(u) ? "Linux PC" : "Device";
  const native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  const standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  const br = native ? "AGW app" : standalone ? "installed app" : /Edg\//.test(u) ? "Edge" : /Chrome\//.test(u) ? "Chrome" : /Safari\//.test(u) ? "Safari" : /Firefox\//.test(u) ? "Firefox" : "browser";
  return `${os} · ${br}`; }

let pendingPoll = null;
async function tryLogin(){
  if(gate.busy) return; gate.busy = true; gate.msg = ""; render();
  try{
    const r = await api("login", {phone:sess.phone, pin:sess.pin, label:sess.label});
    gate.code = r.code || sess.device.slice(0, 6).toUpperCase();
    clearInterval(pendingPoll); pendingPoll = null;
    if(r.status === "ok"){ sess.token = r.token; sess.pin = ""; lsSet("agwq.token", r.token); gate.me = r.me; gate.isAdmin = r.me.role === "admin"; canEditPrices = gate.isAdmin; lsSet("agwq.me", JSON.stringify(r.me)); openApp(); }
    else if(r.status === "pending"){ gate.state = "pending"; gate.name = r.name; pendingPoll = setInterval(() => { if(gate.state === "pending" && !document.hidden) tryLogin(); }, 20000); }
    else if(r.status === "blocked"){ gate.state = "blocked"; sess.pin = ""; }
  }catch(e){ gate.msg = e.message; if(gate.state !== "pending") gate.state = "login"; }
  gate.busy = false; render();
}

function bindGate(){
  const on2 = (id, ev, fn) => { const el = document.getElementById(id); if(el) el.addEventListener(ev, fn); };
  on2("gl-form", "submit", e => { e.preventDefault(); sess.phone = ($("#gl-phone").value || "").replace(/\D/g, "").slice(-10); sess.pin = ($("#gl-pin").value || "").trim();
    if(sess.phone.length !== 10 || !/^\d{4,6}$/.test(sess.pin)){ gate.msg = "Enter your 10-digit mobile number and PIN."; render(); return; } tryLogin(); });
  on2("gl-check", "click", () => { if(sess.pin) tryLogin(); else { gate.state = "login"; render(); } });
  on2("gl-back", "click", () => { clearInterval(pendingPoll); sess.pin = ""; gate.state = "login"; gate.msg = ""; render(); });
  const act = async (fn, okMsg) => { try{ await fn(); toast(okMsg); }catch(e){ toast(e.message); } await doSync(); render(); };
  document.querySelectorAll("[data-dev]").forEach(b => b.addEventListener("click", () => {
    const kind = b.dataset.dev, h = b.dataset.h, s = b.dataset.s;
    if(kind === "remove" && state.confirmRemove !== h + s){ state.confirmRemove = h + s; b.textContent = "Confirm remove"; return; }
    act(() => api(kind === "approve" ? "approveDevice" : kind === "block" ? "blockDevice" : "removeDevice", {hash:h, staffId:s}), kind === "approve" ? "Device approved" : kind === "block" ? "Device blocked" : "Device removed"); }));
  document.querySelectorAll("[data-st-save]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.stSave, v = k => document.getElementById(`st-${k}-${id}`);

const pick = (row, keys) => { for(const k of keys){ const hit = Object.keys(row).find(h => h.trim().toLowerCase()===k); if(hit && row[hit]!=="" && row[hit]!=null) return String(row[hit]).trim(); } return ""; };
let prodColl = [], catDoc = null;
function mergeProducts(){ const m = new Map(); ((catDoc && catDoc.items) || []).forEach(p => m.set(p.id, {...p, fromOdoo:true})); prodColl.forEach(p => m.set(p.id, p));
  state.products = [...m.values()].sort((a,b) => (num(b.uses)-num(a.uses)) || String(a.name).localeCompare(String(b.name))); }
async function removeProduct(id){ const p = state.products.find(x=>x.id===id);
  if(p && p.fromOdoo && !prodColl.some(x=>x.id===id)){ await db.doc("catalog/odoo").set({...catDoc, items: catDoc.items.filter(x=>x.id!==id)}); }
  else await db.collection("products").doc(id).delete(); }
async function importProducts(file){
  if(!window.XLSX){ state.importMsg="The spreadsheet reader didn't load. Check your connection and reopen the page."; render(); return; }
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
    let lastName="", items=[];
    rows.forEach(r => {
      let name = pick(r,["name","product name","display name","product","product/name"]);
      const code = pick(r,["internal reference","default_code","reference","product code"]);
      if(!name && !code) return; // Odoo puts extra tax lines on blank rows
      if(!name) name = lastName; lastName = name;
      const taxes = pick(r,["customer taxes","taxes","taxes_id","sales taxes"]);
      const m = taxes.match(/(\d+(?:\.\d+)?)\s*%/) || taxes.match(/gst\s*(\d+)/i);
      items.push({ name, code, price: num(pick(r,["sales price","list_price","price","unit price"]).replace(/[^\d.\-]/g,"")),
        unit: pick(r,["unit of measure","uom","uom_id","sales unit","unit"]) || "Nos",
        hsn: pick(r,["hsn/sac code","hsn code","hsn/sac","l10n_in_hsn_code","hsn"]),
        gst: (m && num(m[1])===0) ? 0 : 18, desc: pick(r,["sales description","description_sale","description"]),
        category: pick(r,["product category","category","categ_id"]) });
    });
    if(!items.length){ state.importMsg = "No products found in that file. Make sure the export includes the Name column."; render(); return; }
    const seen = new Set(); let done = 0;
    for(const p of items){
      const id = slug(p.code || p.name); if(seen.has(id)) continue; seen.add(id);
      await db.collection("products").doc(id).set(p); done++;
      if(done % 25 === 0){ state.importMsg = `Importing… ${done} of ${items.length}`; render(); }
    }
    state.importMsg = `Imported ${done} products from ${file.name}.`; render();
  }catch(e){ state.importMsg = "Import stopped: "+(e.message||e.code||e)+". Products saved so far are kept."; render(); }
}

  if(state.quotes.some(x => x.number===q.number && x.id!==q.id)){ toast(`Quote no. ${q.number} is already used`); $("#q-number")?.focus(); return false; }
  const body = clone(q); delete body.id;
  body.items = body.items.filter(it => it.name.trim() || num(it.rate)).map(it => ({...it, qty:num(it.qty), rate:num(it.rate), disc:num(it.disc), gst:num(it.gst)}));
  body.freight = num(body.freight); body.freightGst = num(body.freightGst);
  body.grandTotal = calc(body).grand; body.updatedAt = new Date().toISOString(); if(!q.id) body.createdAt = body.updatedAt;
  try{
    const ref = q.id ? db.collection("quotes").doc(q.id) : db.collection("quotes").doc();
    await ref.set(body); q.id = ref.id;
    const c = body.client, cid = slug(c.name);
    const existing = state.clients.find(x=>x.id===cid);
    const cbody = {name:c.name.trim(),company:c.company,phone:c.phone,email:c.email,address:c.address,gstin:c.gstin,state:c.state};
    if(!existing || ["company","phone","email","address","gstin","state"].some(k => (existing[k]||"")!==(cbody[k]||""))) await db.collection("clients").doc(cid).set(cbody);
    state.dirty=false; render(); toast(`${q.number} saved`); return true;

}

/* ---------- PDF ---------- */
function drawSystem(doc, it, x, y, w, h){
  try{
    const s = it.slim || it.blandox || {}; const sys = String(s.system||"").toUpperCase();
    const P = state.prices || {};
    const hBlank = String(s.height ?? "").trim()==="";
    const wft = toMm(s.width, s.widthUnit||"FT")/304.8 || 8;
    const hft = hBlank ? (num(s.defH)||num(P.defaultHeightFt)||10) : (toMm(s.height, s.heightUnit||"FT")/304.8 || 8);
    const layouts = {"SYNCHRO":["F","S<","S>","F"], "2+1":["F","S<","S<"], "3+1":["F","S<","S<","S<"], "ONE FIX AND SLIDE":["F","S<"], "SINGLE SLIDE":["S<"], "4+1":["F","S<","S<","S<","S<"], "5+1":["F","S<","S<","S<","S<","S<"], "2+4 SYNCHRO":["F","S<","S<","S>","S>","F"], "2+6 SYNCHRO":["F","S<","S<","S<","S>","S>","S>","F"], "SWING DOOR":["W"], "FIX PARTITION WITHOUT TRACK":["F"], "FIX PARTITION WITH TRACK":["F"]};
    const panels = layouts[sys] || ["F"];
    const hasTrack = sys==="FIX PARTITION WITH TRACK" || panels.some(p => p[0]==="S");
    const padL = 5, padB = 5, padT = hasTrack ? 2 : 0.5;
    const aw = w - padL, ah = h - padB - padT;
    let fw = aw, fh = aw*hft/wft; if(fh > ah){ fh = ah; fw = ah*wft/hft; }
    const fx = x + padL + (aw-fw)/2, fy = y + padT;
    const pw = fw / panels.length;
    const lines = Array.isArray(s.glass) ? s.glass : [];
    const tint = n => /tint/i.test(n) ? [200,204,209] : /fabric/i.test(n) ? [238,230,215] : /flut|reed/i.test(n) ? [221,231,238] : [229,240,247];
    const bands = lines.length ? lines.map(l => ({name:String(l.glass||""), hh: fh * Math.max(0, num(l.hft))/hft})) : [{name:"", hh:fh}];
    let gy = fy;
    bands.forEach(b => {
      doc.setFillColor(...(b.name ? tint(b.name) : [241,244,246])); doc.rect(fx, gy, fw, b.hh, "F");
      if(/flut|reed/i.test(b.name)){ doc.setDrawColor(176,192,204); doc.setLineWidth(0.08); for(let xx = fx+0.7; xx < fx+fw-0.2; xx += 0.8) doc.line(xx, gy+0.2, xx, gy+b.hh-0.2); }
      if(/fabric/i.test(b.name)){ doc.setDrawColor(214,202,182); doc.setLineWidth(0.08); for(let yy = gy+0.8; yy < gy+b.hh-0.2; yy += 0.8) doc.line(fx+0.2, yy, fx+fw-0.2, yy); }
      gy += b.hh;
    });
    doc.setDrawColor(55,60,66); doc.setLineWidth(0.35);
    let dy = fy; bands.slice(0,-1).forEach(b => { dy += b.hh; doc.line(fx, dy, fx+fw, dy); });
    doc.setLineWidth(0.7); doc.rect(fx, fy, fw, fh, "S");
    doc.setLineWidth(0.5); for(let i=1;i<panels.length;i++) doc.line(fx+pw*i, fy, fx+pw*i, fy+fh);
    if(hasTrack){ doc.setFillColor(55,60,66); doc.rect(fx-0.6, fy-1.6, fw+1.2, 1.2, "F"); }
    doc.setTextColor(55,60,66); doc.setFont("helvetica","bold"); doc.setFontSize(5.5);
    panels.forEach((p,i) => { const cx = fx + pw*i + pw/2, cy = fy + fh*0.5;
      if(p==="F"){ doc.text("FIX", cx, cy+0.8, {align:"center"}); }
      else if(p==="W"){ doc.setLineDashPattern([0.8,0.6],0); doc.setLineWidth(0.25); doc.line(fx+pw*(i+1), fy, fx+pw*i, fy+fh/2); doc.line(fx+pw*i, fy+fh/2, fx+pw*(i+1), fy+fh); doc.setLineDashPattern([],0); }
      else { const dir = p.endsWith(">") ? 1 : -1, len = Math.max(2.5, Math.min(pw*0.55, 7)); doc.setLineWidth(0.35); const a = cx - dir*len/2, tip = cx + dir*len/2; doc.line(a, cy, tip, cy); doc.line(tip, cy, tip - dir*1.3, cy-0.9); doc.line(tip, cy, tip - dir*1.3, cy+0.9); }
    });
    doc.setFont("helvetica","normal"); doc.setFontSize(5.8); doc.setTextColor(95);
    const wTxt = `W ${s.width} ${String(s.widthUnit||"FT").toLowerCase()}`;
    const hTxt = hBlank ? `H ${ft1(hft)} ft` : `H ${s.height} ${String(s.heightUnit||"FT").toLowerCase()}`;
    doc.text(wTxt, fx+fw/2, fy+fh+3.6, {align:"center"});
    doc.text(hTxt, fx-1.6, fy+fh/2 + doc.getTextWidth(hTxt)/2, {angle:90});
    doc.setTextColor(30); doc.setDrawColor(200,204,208); doc.setLineWidth(0.2);
  }catch(e){ /* a drawing problem must never stop the PDF */ }
}

/* ---------- payment details box (bank + UPI QR), printed at the end of the quotation ---------- */
function upiPayload(f){ const pa = String(f.upiId||"").trim(); if(!pa) return ""; return `upi://pay?pa=${pa}&pn=${encodeURIComponent(f.accName || f.name || "")}&cu=INR`; }
function drawQr(doc, text, x, y, size){ try{ if(!window.qrcode || !text) return false; const q = qrcode(0, "M"); q.addData(text); q.make(); const n = q.getModuleCount(), cell = size/(n+2);
  doc.setFillColor(255,255,255); doc.rect(x, y, size, size, "F"); doc.setFillColor(20,20,20);
  for(let r=0;r<n;r++) for(let c2=0;c2<n;c2++) if(q.isDark(r,c2)) doc.rect(x+(c2+1)*cell, y+(r+1)*cell, cell+0.01, cell+0.01, "F"); return true; }catch(e){ return false; } }
function payLines(f){ const L = [];
  if(f.accName) L.push(["Beneficiary", f.accName]); if(f.bankName) L.push(["Bank", f.bankName + (f.branch ? ", "+f.branch : "")]);
  if(f.accNo) L.push(["Account no.", f.accNo]); if(f.ifsc) L.push(["IFSC", f.ifsc]); if(f.upiId) L.push(["UPI ID", f.upiId]); return L; }
function drawPayBox(doc, x, y, w, f, accent){
  const L = payLines(f), extra = !L.length && String(f.bank||"").trim() ? doc.splitTextToSize(String(f.bank), w-50) : [];
  if(!L.length && !extra.length && !f.upiId) return 0;
  const qr = upiPayload(f), qs = qr ? 30 : 0, h = Math.max(qs + 12, 12 + (L.length||extra.length)*5.2 + 4);
  doc.setDrawColor(...(accent||[200,204,208])); doc.setLineWidth(0.3); doc.roundedRect(x, y, w, h, 2, 2, "S");
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...(accent||[60,60,60])); doc.text("PAYMENT DETAILS", x+4, y+6.5);
  let ly = y+12.5; doc.setFontSize(8.5);
  L.forEach(([k,v]) => { doc.setFont("helvetica","normal"); doc.setTextColor(120,116,108); doc.text(k, x+4, ly); doc.setFont("helvetica","bold"); doc.setTextColor(40,40,38); doc.text(String(v), x+30, ly); ly += 5.2; });
  if(extra.length){ doc.setFont("helvetica","normal"); doc.setTextColor(40,40,38); doc.text(extra, x+4, ly); }
  if(qr){ const qx = x+w-qs-6; if(drawQr(doc, qr, qx, y+3, qs)){ doc.setFont("helvetica","normal"); doc.setFontSize(6.3); doc.setTextColor(120,116,108); doc.text("Scan to pay with any UPI app", qx+qs/2, y+qs+6, {align:"center"}); } }
  return h;
}

async function saveFile(name, blob){
  const C = window.Capacitor, P = C && C.Plugins;
  if(C && C.isNativePlatform && C.isNativePlatform() && P && P.Filesystem && P.Share){
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
    const w = await P.Filesystem.writeFile({path:name, data:b64, directory:"CACHE"});
    try{ await P.Share.share({title:name, files:[w.uri]}); }catch(e){} return; }
  const file = new File([blob], name, {type:blob.type});
  if(/Android|iPhone|iPad/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e && e.name === "AbortError") return; } }
  const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000); toast("Saved " + name);
}

function ftIn(mm){ const inch = Math.round(mm/25.4*2)/2; const ft = Math.floor(inch/12); const r = inch - ft*12; const w = Math.floor(r); return `${ft}'-${w}${r-w>0?"½":""}"`; }

function profileRgb(name){ const n = String(name||"").toLowerCase();
  if(/black/.test(n)) return [38,38,38]; if(/rose|copper/.test(n)) return [183,121,98]; if(/gold|champ|bronze|brass/.test(n)) return [184,146,84];

function slimDims(it){ const s = it.slim||it.blandox||{}, P = state.prices||{};

function spaced(doc, txt, cx, y, sp){ const ch = [...String(txt)]; const ws = ch.map(c=>doc.getTextWidth(c)); const tot = ws.reduce((a,b)=>a+b,0) + sp*(ch.length-1);

function drawElevation(doc, it, x, y, w, h){
  try{
    const d = slimDims(it), s = d.s, sys = String(s.system||"").toUpperCase();

function buildPremium(doc, q, f, c){
  const slims = q.items.map((it,i) => ({it, i, r:c.rows[i]})).filter(x => isSlimIt(x.it));
  const gOn = q.gstOn!==false;
  pxCover(doc, q, f, slims.length);
  const kinds = ["cover"];
  if(slims.length){
    const sets = slims.reduce((a,x)=>a+(x.it.unit==="Set"||!x.it.unit ? num(x.it.qty) : 0),0);
    for(let k=0;k<slims.length;k+=2){
      doc.addPage("a4","portrait"); kinds.push("sheet");
      pxHeader(doc, q, f, "PRODUCT DETAILS");
      doc.setFont("helvetica","normal"); doc.setFontSize(7.3); doc.setTextColor(...PX.mute);
      doc.text(`TOTAL SYSTEMS: ${slims.length}  /  TOTAL SETS: ${sets}`, 16, 38); doc.text(`PRODUCT SHEET ${pad2(k/2+1)}`, 194, 38, {align:"right"});
      [slims[k], slims[k+1]].filter(Boolean).forEach((x,j) => pxCard(doc, x, k+j+1, 44 + j*119, gOn));
    }
    slims.forEach((x,k) => { pxElevation(doc, x, k+1, q, f); kinds.push("elev"); });
  }
  const before = doc.getNumberOfPages();
  pxQuote(doc, q, f, c);
  for(let p=before+1; p<=doc.getNumberOfPages(); p++) kinds[p-1] = "quote";
  const total = doc.getNumberOfPages();
  for(let p=2; p<=total; p++){ if(kinds[p-1]==="elev") continue; doc.setPage(p);
    doc.setDrawColor(...PX.gold); doc.setLineWidth(0.35); doc.line(16, 283, 194, 283);
    doc.setFont("helvetica","normal"); doc.setFontSize(6.8); doc.setTextColor(...PX.mute);
    doc.text(`${String(f.name||"").toUpperCase()}  ·  ${tagOf(f).toUpperCase()}`, 16, 288);
    doc.text(kinds[p-1]==="sheet" ? `ALL DIMENSIONS AS ENTERED  ·  PAGE ${p} OF ${total}` : `PAGE ${p} OF ${total}`, 194, 288, {align:"right"}); }
}

async function savePdf(doc, q){
  const cl = q.client||{};
  const name = `${q.number.replace(/[\/\\]+/g,"-")} ${cl.name||"Quote"}.pdf`.replace(/[^\w .\-]+/g,"");
  try{ await saveFile(name, doc.output("blob")); }catch(e){ toast("PDF not saved: "+(e.message||e)); }
}

  doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.text(f.name||"", M, 13);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
  doc.text([f.address, [f.gstin?`GSTIN: ${f.gstin}`:"", q.sp && q.sp.phone ? `${q.sp.name ? q.sp.name+": " : ""}${q.sp.phone}` : ""].filter(Boolean).join("   |   ")].filter(Boolean), M, 19);
  doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.text("QUOTATION", W-M, 13, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
  doc.text([`No: ${q.number}`, `Date: ${fmtDate(q.date)}`, `Valid till: ${fmtDate(q.validTill)}`], W-M, 19, {align:"right"});
  doc.setTextColor(30);
  let y = 38; const cl = q.client;
  doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(110); doc.text("BILL TO", M, y);
  doc.setTextColor(30); doc.setFontSize(11); doc.text(cl.name||"", M, y+6);
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  const billLines = [cl.company, ...(doc.splitTextToSize(cl.address||"", 110)), [cl.phone, cl.email].filter(Boolean).join("  |  "), [cl.gstin?`GSTIN: ${cl.gstin}`:"", cl.state?`State: ${cl.state}`:""].filter(Boolean).join("   ")].filter(Boolean);
  doc.text(billLines, M, y+11);
  y = y + 13 + billLines.length*4;
  const intra = q.taxMode==="intra", gOn = q.gstOn!==false;
  const isSlim = it => !!(it && (it.slim||it.blandox));
  const anyDesign = q.items.some(isSlim), anyHsn = q.items.some(it=>String(it.hsn||"").trim()), anyDisc = q.items.some(it=>num(it.disc));
  const cols = [{h:"#", w:7, a:"center", v:(it,r,i)=>i+1}];
  if(anyDesign) cols.push({h:"Design", w:36, design:true, v:()=>""});
  cols.push({h:"Item & description", w:"auto", desc:true, v:it=>it.name + (it.desc?`\n${it.desc}`:"")});
  if(anyHsn) cols.push({h:"HSN", w:14, v:it=>it.hsn||""});
  cols.push({h:"Qty", w:16, a:"right", v:it=>`${num(it.qty)} ${it.unit||""}`});
  cols.push({h:"Rate", w:20, a:"right", v:it=>inr(num(it.rate))});
  if(anyDisc) cols.push({h:"Disc", w:11, a:"right", v:it=>num(it.disc)?num(it.disc)+"%":"-"});
  if(gOn){ cols.push({h:"Taxable", w:21, a:"right", v:(it,r)=>inr(r.taxable)}); cols.push({h:"GST", w:11, a:"right", v:it=>num(it.gst)+"%"}); }
  cols.push({h:"Amount", w:23, a:"right", v:(it,r)=>inr(gOn ? r.total : r.taxable)});
  const body = q.items.map((it,i) => cols.map(cl => cl.v(it, c.rows[i], i)));
  if(c.fr) body.push(cols.map(cl => cl.desc ? "Freight / transport" : (cl.h==="Rate"||cl.h==="Taxable") ? inr(c.fr) : cl.h==="GST" ? num(q.freightGst)+"%" : cl.h==="Amount" ? inr(gOn ? c.fr+c.frTax : c.fr) : ""));
  const dIdx = cols.findIndex(cl=>cl.design);
  const colStyles = {}; cols.forEach((cl,k) => { colStyles[k] = cl.a ? {cellWidth:cl.w, halign:cl.a} : {cellWidth:cl.w}; });
  doc.autoTable({ startY:y,
    didParseCell: d => { if(d.section==="body" && dIdx>=0 && d.column.index===dIdx && isSlim(q.items[d.row.index])) d.cell.styles.minCellHeight = 32; },
    didDrawCell: d => { if(d.section==="body" && dIdx>=0 && d.column.index===dIdx){ const it = q.items[d.row.index]; if(isSlim(it)) drawSystem(doc, it, d.cell.x+1.5, d.cell.y+1.5, d.cell.width-3, Math.min(d.cell.height-3, 36)); } },
    head:[cols.map(cl=>cl.h)], body,
    margin:{left:M,right:M}, theme:"grid",
    styles:{font:"helvetica",fontSize:8.5,cellPadding:2.2,lineColor:line,lineWidth:.2,textColor:30,valign:"top"},
    headStyles:{fillColor:light,textColor:40,fontStyle:"bold"},
    columnStyles:colStyles });
  y = doc.lastAutoTable.finalY + 6;
  const tRows = gOn ? [["Taxable value", inr(c.taxable)], ...(intra ? [["CGST", inr(c.tax/2)],["SGST", inr(c.tax/2)]] : [["IGST", inr(c.tax)]]), ["Round off", (c.round<0?"-":"")+inr(Math.abs(c.round))]] : [["Sub-total", inr(c.taxable)], ["Round off", (c.round<0?"-":"")+inr(Math.abs(c.round))]];
  if(y > 250){ doc.addPage(); y = 20; }
  doc.setFontSize(9); const tx = W-M-75;
  tRows.forEach(([a,b]) => { doc.text(a, tx, y); doc.text("Rs. "+b, W-M, y, {align:"right"}); y+=5; });
  doc.setDrawColor(...line); doc.line(tx, y-2, W-M, y-2);
  doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.text("Grand total", tx, y+3); doc.text("Rs. "+inr(c.grand,0), W-M, y+3, {align:"right"});
  y += 9; doc.setFont("helvetica","italic"); doc.setFontSize(8.5);
  doc.text(doc.splitTextToSize(`Rupees ${words(c.grand)} Only`, W-2*M), W-M, y, {align:"right"}); y += 8;
  const block = (title, text) => { if(!text) return; const lines = doc.splitTextToSize(text, W-2*M); if(y + 6 + lines.length*4 > 280){ doc.addPage(); y=20; }
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(110); doc.text(title, M, y); doc.setTextColor(30);
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.text(lines, M, y+5); y += 8 + lines.length*4; };
  block("NOTES", q.notes); block("TERMS & CONDITIONS", q.terms);
  { const need = (payLines(f).length || f.upiId || f.bank) ? 46 : 0; if(need && y + need > 272){ doc.addPage(); y = 20; } const ph = drawPayBox(doc, M, y, W-2*M, f, [74,81,89]); if(ph) y += ph + 6; }
  if(y > 262){ doc.addPage(); y = 20; }
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.text(`For ${f.name}`, W-M, y+4, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(110); doc.text("Authorised signatory", W-M, y+20, {align:"right"});
  const pages = doc.getNumberOfPages(); for(let p=1;p<=pages;p++){ doc.setPage(p); doc.setFontSize(7.5); doc.setTextColor(140); doc.text(`${q.number}  ·  Page ${p} of ${pages}`, W/2, 292, {align:"center"}); }
  const name = `${q.number.replace(/[\/\\]+/g,"-")} ${cl.name||"Quote"}.pdf`.replace(/[^\w .\-]+/g,"");
  try{ await saveFile(name, doc.output("blob")); }catch(e){ toast("PDF not saved: "+(e.message||e)); }
}

/* ---------- CSV export for Odoo ---------- */
async function exportCsv(){
  const cell = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rows = [["Order Reference","Order Date","Validity","Status","Customer","Customer Company","Customer Phone","Customer GSTIN","Customer State","Product","Description","HSN","Quantity","Unit","Unit Price","Discount (%)","Taxes","Subtotal"]];
  state.quotes.forEach(q => { const c = calc(q); (q.items||[]).forEach((it,i) => rows.push([q.number,q.date,q.validTill,q.status,q.client?.name,q.client?.company,q.client?.phone,q.client?.gstin,q.client?.state,it.name,it.desc,it.hsn,num(it.qty),it.unit,num(it.rate),num(it.disc),`GST ${num(it.gst)}%`,c.rows[i].taxable.toFixed(2)]));
    if(num(q.freight)) rows.push([q.number,q.date,q.validTill,q.status,q.client?.name,q.client?.company,q.client?.phone,q.client?.gstin,q.client?.state,"Freight","","",1,"Job",num(q.freight),0,`GST ${num(q.freightGst)}%`,num(q.freight).toFixed(2)]); });
  const csv = "﻿" + rows.map(r => r.map(cell).join(",")).join("\r\n");
  try{ await saveFile(`AGW quotes ${today()}.csv`, new Blob([csv],{type:"text/csv"})); }
  catch(e){ if(e && e.code!=="declined" && e.code!=="cancelled") toast("CSV not saved: "+(e.message||e.code)); }
}

/* ---------- boot ---------- */
render();
(async () => {
  db = { collection: c => collRef(c), doc: path => { const [c, id] = String(path).split("/"); return docRef(c, id); } };
  if(!API_URL){ gate.state = "login"; gate.msg = "Server address is missing in config.js."; render(); return; }
  sess.label = deviceLabel(); sess.device = await sha256("agwq:" + await deviceKey());
  sess.token = lsGet("agwq.token");
  if(sess.token){ try{ gate.me = JSON.parse(lsGet("agwq.me") || "null"); }catch(e){} gate.isAdmin = !!(gate.me && gate.me.role === "admin"); canEditPrices = gate.isAdmin; openApp(); }
  else { gate.state = "login"; render(); }
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
function startData(){
  const slowT = setTimeout(() => { if(!state.loaded){ state.slow=true; render(); } }, 10000);
  db.doc("settings/firm").onSnapshot(s => { if(s.exists){ state.firm = {...DEFAULT_FIRM, ...s.data()}; if(state.view!=="edit" && state.view!=="firm") render(); } }, () => {});
  db.collection("glass").orderBy("name").onSnapshot(s => { state.glass = s.docs.map(d => ({id:d.id, ...d.data()})); if(state.view==="options") render(); }, () => {});
  db.collection("colours").orderBy("name").onSnapshot(s => { state.colours = s.docs.map(d => ({id:d.id, ...d.data()})); if(state.view==="options") render(); }, () => {});
  RANGES.forEach(R => db.doc(R.doc).onSnapshot(s => { const had = !!state.priceDocs[R.id]; state.priceDocs[R.id] = s.exists ? s.data() : null; if(state.view==="products" || (state.view==="edit" && !had && !state.bx)) render(); }, () => {}));
  const prodRender = () => { mergeProducts(); if(state.view==="products" && !/Importing/.test(state.importMsg)) render(); };
  db.collection("products").orderBy("name").onSnapshot(s => { prodColl = s.docs.map(d => ({id:d.id, ...d.data()})); prodRender(); }, () => {});
  db.doc("catalog/odoo").onSnapshot(s => { catDoc = s.exists ? s.data() : null; prodRender(); }, () => {});
  db.collection("clients").orderBy("name").onSnapshot(s => { state.clients = s.docs.map(d => ({id:d.id, ...d.data()})); if(state.view==="clients") render(); }, () => {});
  db.collection("quotes").orderBy("updatedAt","desc").onSnapshot(s => {
    state.quotes = s.docs.map(d => ({id:d.id, ...d.data()}));
    if(!s.metadata.fromCache){ state.loaded=true; state.slow=false; clearTimeout(slowT); }
    else if(s.size) state.loaded=true;
    if(state.view==="quotes" || state.view==="clients") render();
  }, e => { clearTimeout(slowT); state.loaded=true; state.error = "Saved quotes can't be loaded right now ("+(e.message||e.code)+"). Reopen the page to try again."; render(); });
}
})();
