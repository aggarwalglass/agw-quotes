name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor project
        run: |
          npm install
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          APP_URL="${APP_URL:-https://${OWNER,,}.github.io/${REPO}/}"
          cat > capacitor.config.json <<JSON
          {"appId":"in.agwgroup.quotes","appName":"AGW Quotes","webDir":"web",
           "server":{"url":"$APP_URL","androidScheme":"https"},
           "android":{"allowMixedContent":false}}
          JSON
          npx cap add android
          npx cap sync android
        env: { APP_URL: "${{ vars.APP_URL }}" }
      - name: Icon, screenshot blocking, signing
        env: { KS_PASS: "${{ secrets.KEYSTORE_PASS || 'agw-build-key' }}" }
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp web/icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp web/icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            rm -f android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          MA=$(find android/app/src/main/java -name MainActivity.java)
          cp android-extra/MainActivity.java "$MA"
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/agw.keystore;
          else keytool -genkeypair -keystore android/app/agw.keystore -alias agw -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Aggarwal Glass Works, O=AGW, L=Bathinda, C=IN"; fi
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs { agw { storeFile file('agw.keystore'); storePassword System.getenv('KS_PASS'); keyAlias 'agw'; keyPassword System.getenv('KS_PASS') } }
            buildTypes { release { signingConfig signingConfigs.agw; minifyEnabled false } }
          }
          GRADLE
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env: { KS_PASS: "${{ secrets.KEYSTORE_PASS || 'agw-build-key' }}" }
      - run: cp android/app/build/outputs/apk/release/app-release.apk AGW-Quotes.apk
      - uses: actions/upload-artifact@v4
        with: { name: AGW-Quotes-apk, path: AGW-Quotes.apk }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          files: AGW-Quotes.apk
